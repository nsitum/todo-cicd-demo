services:
  frontend:
    build: ./frontend

    container_name: todo_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

  backend:
    build: ./backend

    container_name: todo_backend

    ports:
      - "3000:3000"

    depends_on:
      - postgres

  postgres:
    image: postgres:16

    container_name: todo_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: